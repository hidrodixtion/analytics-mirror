<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics mirror</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --line: #2b3038; --fg: #e6e9ef;
    --dim: #8d96a5; --key: #7fb3ff; --str: #9ece6a; --num: #e0af68; --accent: #3d5afe;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e1e4ea; --fg: #1a1d23;
      --dim: #6b7280; --key: #1d4ed8; --str: #15803d; --num: #b45309; --accent: #3d5afe;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  header input { flex: 1; min-width: 120px; }
  #types { display: flex; gap: 4px; }
  #types button[data-t="track"][aria-pressed="false"] { color: var(--str); }
  #types button[data-t="screen"][aria-pressed="false"] { color: var(--num); }
  #types button[data-t="identify"][aria-pressed="false"] { color: var(--key); }
  input, button {
    font: inherit; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #count { color: var(--dim); white-space: nowrap; }
  main { flex: 1; display: grid; grid-template-columns: minmax(312px, 442px) 1fr; min-height: 0; }
  #list { overflow-y: auto; border-right: 1px solid var(--line); }
  #list div {
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; display: flex; gap: 8px; align-items: baseline;
  }
  #list div:hover { background: var(--panel); }
  #list div[aria-selected="true"] { background: var(--accent); color: #fff; }
  #list div[aria-selected="true"] .type, #list div[aria-selected="true"] time { color: #dbe1ff; }
  #list .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type { color: var(--dim); font-size: 11px; text-transform: uppercase; }
  .type[data-t="track"] { color: var(--str); }
  .type[data-t="screen"] { color: var(--num); }
  .type[data-t="identify"] { color: var(--key); }
  time { color: var(--dim); font-size: 11px; }
  #detail { overflow-y: auto; padding: 14px 16px; }
  #detail h2 { margin: 0 0 4px; font-size: 15px; }
  #detail h3 { margin: 18px 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 3px 8px 3px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  td:first-child { color: var(--key); width: 1%; white-space: nowrap; }
  td.val { word-break: break-word; }
  td.act { width: 1%; padding-right: 0; text-align: right; }
  .copy {
    background: none; border: 0; padding: 2px 4px 0; border-radius: 4px;
    color: var(--dim); line-height: 0;
  }
  .copy:hover { color: var(--fg); border-color: transparent; }
  .copy.ok { color: var(--str); }
  .copy.err { color: var(--num); }
  h3 .copy { margin-left: 6px; vertical-align: -3px; }
  td.act .copy { opacity: 0; transition: opacity .1s; }
  tr:hover .copy, .copy:focus-visible, .copy.ok, .copy.err { opacity: 1; }
  .s { color: var(--str); } .n { color: var(--num); } .d { color: var(--dim); }
  /* Wrap at spaces so indentation survives; let an unbreakable token scroll rather than shatter. */
  pre.json { margin: 0; white-space: pre-wrap; overflow-x: auto; color: var(--dim); }
  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; color: var(--dim); }
  .empty { color: var(--dim); padding: 24px 16px; }
</style>
</head>
<body>
<header>
  <strong>Analytics mirror</strong>
  <span id="count">0</span>
  <input id="q" type="search" placeholder="Filter by name, type, or any value…">
  <div id="types">
    <button data-t="all" aria-pressed="true">All</button>
    <button data-t="track" aria-pressed="false">Track</button>
    <button data-t="screen" aria-pressed="false">Screen</button>
    <button data-t="identify" aria-pressed="false">Identify</button>
  </div>
  <button id="pretty" aria-pressed="true">Pretty</button>
  <button id="pause" aria-pressed="false">Pause</button>
  <button id="clear">Clear</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail" class="empty">Waiting for events…</div>
</main>

<script>
const listEl = document.querySelector('#list')
const detailEl = document.querySelector('#detail')
const countEl = document.querySelector('#count')
const qEl = document.querySelector('#q')
const pauseEl = document.querySelector('#pause')
const typesEl = document.querySelector('#types')
const prettyEl = document.querySelector('#pretty')

let events = []
let seq = 0
let selectedId = null
let scrolledId = null
let paused = false
let typeFilter = 'all'
let pretty = true
let shown = []   // what the list currently displays, in display order — drives arrow-key nav

const add = (e) => events.push({ ...e, id: ++seq })

new EventSource('/stream').onmessage = ({ data }) => {
  const msg = JSON.parse(data)
  if (msg.replay) msg.replay.forEach(add)
  else add(msg)
  if (!paused) render()   // still buffered while paused; unpause shows everything
}

const matches = (e, q) =>
  !q || (e.payload.event || '') .toLowerCase().includes(q)
     || (e.payload.type || '').toLowerCase().includes(q)
     || JSON.stringify(e.payload).toLowerCase().includes(q)

const typeOf = (e) => (e.payload.type || '').toLowerCase()

function render() {
  const q = qEl.value.trim().toLowerCase()
  shown = events
    .filter(e => (typeFilter === 'all' || typeOf(e) === typeFilter) && matches(e, q))
    .reverse()
  const filtered = q || typeFilter !== 'all'
  countEl.textContent = filtered ? `${shown.length}/${events.length}` : events.length

  listEl.replaceChildren(...shown.map(e => {
    const row = document.createElement('div')
    row.setAttribute('aria-selected', e.id === selectedId)
    row.onclick = () => { selectedId = e.id; render() }
    row.innerHTML =
      `<span class="name"></span><span class="type"></span><time></time>`
    row.querySelector('.name').textContent = e.payload.event || e.payload.name || e.payload.type || '—'
    const t = row.querySelector('.type')
    t.textContent = e.payload.type || ''
    t.dataset.t = typeOf(e)
    row.querySelector('time').textContent = new Date(e.at).toLocaleTimeString()
    return row
  }))

  // Keep the selected row visible for arrow-key nav, but don't yank the scroll
  // position while events stream in and re-render underneath the user.
  if (selectedId !== scrolledId) {
    listEl.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' })
    scrolledId = selectedId
  }

  renderDetail(events.find(e => e.id === selectedId))
}

const json = (v) => JSON.stringify(v, null, pretty ? 2 : 0)

function fmt(v) {
  if (typeof v === 'string') return `<span class="s">"${esc(v)}"</span>`
  if (typeof v === 'number' || typeof v === 'boolean') return `<span class="n">${v}</span>`
  if (v === null || v === undefined) return `<span class="d">${v}</span>`
  return `<pre class="json">${esc(json(v))}</pre>`
}
const esc = (s) => String(s).replace(/[<&]/g, c => ({ '<': '&lt;', '&': '&amp;' })[c])

// Raw (unquoted, unescaped) text for the clipboard, indexed by data-i on each button.
// Objects copy exactly as displayed, so the Pretty toggle governs the clipboard too.
let copyBuf = []
const stash = (text) => copyBuf.push(text) - 1
const ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>'
const copyBtn = (text, label) => `<button class="copy" title="${label}" aria-label="${label}" data-i="${stash(text)}">${ICON}</button>`
const raw = (v) => typeof v === 'string' ? v : json(v)

function table(obj) {
  const keys = Object.keys(obj || {}).sort()
  if (!keys.length) return '<p class="d">(empty)</p>'
  return `<table>${keys.map(k =>
    `<tr><td>${esc(k)}</td><td class="val">${fmt(obj[k])}</td>` +
    `<td class="act">${copyBtn(raw(obj[k]), 'Copy value')}</td></tr>`
  ).join('')}</table>`
}

const section = (title, obj) =>
  `<h3>${title}${copyBtn(JSON.stringify(obj, null, 2), `Copy all ${title}`)}</h3>${table(obj)}`

function renderDetail(e) {
  if (!e) { detailEl.className = 'empty'; detailEl.textContent = 'Select an event'; return }
  detailEl.className = ''
  const p = e.payload
  copyBuf = []
  const sections = []
  if (p.properties) sections.push(section('properties', p.properties))
  if (p.traits) sections.push(section('traits', p.traits))
  if (p.context?.traits) sections.push(section('context.traits', p.context.traits))
  detailEl.innerHTML = `
    <h2>${esc(p.event || p.name || p.type || 'event')}</h2>
    <div class="d">${esc(p.type || '')} · ${new Date(e.at).toLocaleTimeString()} · ${esc(p.userId || p.anonymousId || '')}</div>
    ${sections.join('') || '<p class="d">No properties or traits.</p>'}
    <details><summary>Full envelope</summary><pre>${esc(JSON.stringify(p, null, 2))}</pre></details>`
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text)
    return true
  } catch {
    // Clipboard API is gated off in embedded webviews and on plain-http origins.
    // execCommand is deprecated but needs no permission grant, only a user gesture.
    const ta = document.body.appendChild(document.createElement('textarea'))
    ta.value = text
    ta.style.cssText = 'position:fixed;top:-9999px'
    ta.select()
    const ok = document.execCommand('copy')
    ta.remove()
    return ok
  }
}

detailEl.onclick = async (ev) => {
  const b = ev.target.closest('.copy')
  if (!b) return
  const cls = await copyText(copyBuf[b.dataset.i]) ? 'ok' : 'err'
  b.classList.add(cls)
  setTimeout(() => b.classList.remove(cls), 900)
}

document.onkeydown = (ev) => {
  const step = { ArrowDown: 1, ArrowUp: -1 }[ev.key]
  if (!step || ev.metaKey || ev.ctrlKey || ev.altKey) return
  if (ev.target.closest('input, textarea, select')) return   // let fields keep their own arrows
  if (!shown.length) return
  ev.preventDefault()

  const i = shown.findIndex(e => e.id === selectedId)
  const next = i === -1 ? (step > 0 ? 0 : shown.length - 1) : i + step
  if (next < 0 || next >= shown.length) return   // stop at the ends rather than wrapping
  selectedId = shown[next].id
  render()
}

prettyEl.onclick = () => {
  pretty = !pretty
  prettyEl.setAttribute('aria-pressed', pretty)
  render()
}

typesEl.onclick = (ev) => {
  const b = ev.target.closest('button')
  if (!b) return
  typeFilter = b.dataset.t
  for (const x of typesEl.children) x.setAttribute('aria-pressed', x === b)
  render()
}

qEl.oninput = render
pauseEl.onclick = () => {
  paused = !paused
  pauseEl.setAttribute('aria-pressed', paused)
  pauseEl.textContent = paused ? 'Resume' : 'Pause'
  if (!paused) render()
}
document.querySelector('#clear').onclick = async () => {
  await fetch('/events', { method: 'DELETE' })
  events = []; selectedId = null; render()
}
</script>
</body>
</html>
